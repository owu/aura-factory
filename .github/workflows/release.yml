name: Release

on:
  push:
    tags:
      - 'v[0-9].[0-9].[0-9]*'
      - 'v[0-9].[0-9].[0-9][0-9]*'
      - 'v[0-9].[0-9][0-9].[0-9]*'
      - 'v[0-9].[0-9][0-9].[0-9][0-9]*'
      - 'v[0-9][0-9].[0-9].[0-9]*'
      - 'v[0-9][0-9].[0-9].[0-9][0-9]*'
      - 'v[0-9][0-9].[0-9][0-9].[0-9]*'
      - 'v[0-9][0-9].[0-9][0-9].[0-9][0-9]*'

jobs:
  build:
    name: Build - ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            script: ./build/scripts/build.sh
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            script: ./build/scripts/build.ps1
          - os: macos-13
            target: x86_64-apple-darwin
            script: ./build/scripts/build.sh
          - os: macos-latest
            target: aarch64-apple-darwin
            script: ./build/scripts/build.sh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev

      - name: Build and Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & ${{ matrix.script }}

      - name: Build and Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          chmod +x ${{ matrix.script }}
          ${{ matrix.script }} ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.target }}
          path: build/releases/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-artifacts-*
          merge-multiple: true
          path: releases

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: releases/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
