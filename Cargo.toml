[package]
name = "aura-factory"
version = "0.0.2"
edition = "2024"


[dependencies]
ffmpeg-sidecar = "2.3.0"
slint = "1.14.1"
rfd = "0.15"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.12.24", features = ["blocking", "json", "rustls-tls"] }
rand = "0.9.2"
chrono = "0.4.42"
webbrowser = "1.0.6"

[build-dependencies]
slint-build = "1.14.1"
embed-resource = "2.5.2"
image = "0.25.1"
regex = "1.10.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
